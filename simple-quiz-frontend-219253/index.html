<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Simple Quiz Frontend</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #0b1220;
                --card: #111a2e;
                --text: #e7edf7;
                --muted: #a9b6cc;
                --accent: #6ea8fe;
            }

            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #f5f7fb;
                    --card: #ffffff;
                    --text: #0b1220;
                    --muted: #4b5a73;
                    --accent: #2563eb;
                }
            }

            body {
                margin: 0;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.5;
            }

            main {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .card {
                width: min(720px, 100%);
                background: var(--card);
                border: 1px solid rgba(127, 140, 170, 0.25);
                border-radius: 16px;
                padding: 24px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            }

            h1 {
                font-size: 1.25rem;
                margin: 0 0 8px 0;
            }

            p {
                margin: 0 0 12px 0;
                color: var(--muted);
            }

            code {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
                    monospace;
                font-size: 0.95em;
            }

            a {
                color: var(--accent);
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            .hint {
                margin-top: 16px;
                padding: 12px;
                border-radius: 12px;
                background: rgba(110, 168, 254, 0.12);
                border: 1px solid rgba(110, 168, 254, 0.35);
                color: var(--text);
            }
        </style>
    </head>
    <body>
        <main>
            <section class="card" aria-label="Simple quiz frontend placeholder">
                <h1>Simple Quiz Frontend (Placeholder)</h1>
                <p>
                    Preview is running successfully. This repository currently contains static-analysis scaffolding but no
                    quiz UI yet.
                </p>

                <div class="hint">
                    <p><strong>Next:</strong> Add your frontend source under <code>quiz_application_frontend/</code> and update the container manifest commands accordingly.</p>
                </div>
            </section>
        </main>
    </body>
</html>
